<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>布拉克星球 KPI 系統</title>
<link rel="stylesheet" href="shared/style.css?v=20260624k">
<link rel="stylesheet" href="shared/workspaces.css?v=20260901-workspace-wrap-1">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="shared/config.js?v=20260825-profile-fix-3"></script>
<script src="shared/workspaces.js?v=20260901-cloud-photo-preview-1"></script>
<script src="shared/auth.js?v=20260901-cloud-photo-preview-1"></script>
<script src="shared/api.js?v=20260827-admin-marketing-1"></script>
<script src="shared/ui.js?v=20260825-profile-fix-3"></script>
<script src="shared/pwa.js?v=20260825-profile-fix-3"></script>
<script src="shared/push.js?v=20260825-profile-fix-3"></script>
</head>
<body class="login-page">

<div class="login-card">
  <div class="login-logo"><img src="shared/icons/logo.png" alt="布拉克星球" /></div>
  <div class="login-title">布拉克星球 KPI 系統</div>
  <div class="login-subtitle">老師工作日誌 × KPI 評核</div>

  <div id="g-signin-btn"></div>

  <div id="status-msg" class="mt-2 text-sm muted"></div>
</div>

<script>
let currentEmail = '';

function requestedReturnPath() {
  const value = new URLSearchParams(window.location.search).get('return') || '';
  if (!value || value.startsWith('/') || value.includes('..') || value.includes('\\') || /^[a-z][a-z0-9+.-]*:/i.test(value)) return '';
  return value;
}

function routeAfterLogin(user) {
  const target = requestedReturnPath();
  if (target) window.location.href = target;
  else AUTH.routeByRole(user.role, user);
}

window.addEventListener('load', async () => {
  // 登入入口永遠回到真實帳號，避免上次代看身分殘留到下一次登入。
  let s = AUTH.getSession();
  if (s?.impersonate === true) {
    AUTH.exitImpersonate();
    s = AUTH.getSession();
    if (s?.impersonate === true) {
      AUTH.clearSession();
      s = null;
    }
  }
  // 手機可能保留舊身分；每次從入口進入都先向後端核對再導向。
  if (s) {
    if (s.status === 'suspended') {
      AUTH.clearSession();
      setStatus('此帳號目前未啟用，請聯絡管理員');
      initGoogleSignIn();
      return;
    }
    if (s.email) {
      setStatus('正在確認登入身分...');
      const res = await API.whoami(String(s.email).toLowerCase());
      if (res.ok && res.registered && res.user?.status === 'active') {
        AUTH.setSession({ ...res.user, session_token: res.session_token });
        setStatus('已確認為 ' + res.user.nickname + '，導向中...');
        setTimeout(() => routeAfterLogin(res.user), 300);
        return;
      }
      if (res.ok) {
        AUTH.clearSession();
        setStatus(res.user?.status === 'suspended' ? '此帳號目前未啟用，請聯絡管理員' : '原登入資料已失效，請重新登入');
      } else {
        AUTH.clearSession();
        setStatus('暫時無法驗證登入身分，請確認網路後重新登入');
      }
      initGoogleSignIn();
      return;
    }
    AUTH.clearSession();
    setStatus('請重新登入以確認使用者身分');
  }
  initGoogleSignIn();
});

function initGoogleSignIn() {
  if (!window.google || !google.accounts) {
    setTimeout(initGoogleSignIn, 200);
    return;
  }
  google.accounts.id.initialize({
    client_id: APP_CONFIG.GOOGLE_CLIENT_ID,
    callback: onGoogleSignIn,
    auto_select: false,
  });
  google.accounts.id.renderButton(
    document.getElementById('g-signin-btn'),
    { theme: 'filled_blue', size: 'large', text: 'signin_with', shape: 'pill', width: 280 }
  );
}

async function onGoogleSignIn(response) {
  const payload = AUTH.decodeJwt(response.credential);
  if (!payload || !payload.email) {
    setStatus('登入失敗，請重試');
    return;
  }
  currentEmail = payload.email.toLowerCase();
  setStatus('驗證中...（' + currentEmail + '）');
  UI.loading(true);

  const res = await API.whoami(currentEmail, response.credential);
  UI.loading(false);

  if (!res.ok) {
    setStatus('API 錯誤：' + res.error);
    return;
  }

  if (res.registered) {
    if (res.user.status !== 'active') {
      setStatus('此帳號目前未啟用，請聯絡管理員');
      return;
    }
    AUTH.setSession({ ...res.user, session_token: res.session_token });
    setStatus('歡迎 ' + res.user.nickname + '！導向中...');
    setTimeout(() => routeAfterLogin(res.user), 600);
  } else {
    setStatus('此 Email 尚未開通，請管理員先在帳號設定建立人員並綁定 Email');
  }
}

function setStatus(msg) {
  document.getElementById('status-msg').textContent = msg;
}
</script>

</body>
</html>
