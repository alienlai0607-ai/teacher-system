<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>全機構總覽</title>
<link rel="stylesheet" href="../shared/style.css?v=20260624k">
<script src="../shared/config.js?v=20260825-production-audit-2"></script>
<script src="../shared/auth.js?v=20260903-auth-stability-1"></script>
<script src="../shared/workspaces.js?v=20260903-workspaces-stability-1"></script>
<script src="../shared/api.js?v=20260902-system-stability-3"></script>
<script src="../shared/ui.js?v=20260827-test-view-fast-1"></script>
<script src="../shared/pwa.js?v=20260825-production-audit-2"></script>
<script src="../shared/push.js?v=20260903-push-resilience-1"></script>
<style>
  .dept-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 900px) { .dept-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 500px) { .dept-grid { grid-template-columns: 1fr; } }
  .dept-card {
    background: #fff; border-radius: var(--radius); padding: 18px 14px;
    box-shadow: var(--shadow); text-align: center;
    transition: transform 0.15s;
  }
  .dept-card:hover { transform: translateY(-2px); }
  .dept-name { font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
  .dept-stat { font-size: 14px; margin: 4px 0; }
  .dept-score { font-size: 32px; font-weight: 800; color: var(--accent); }
  .test-view-card { border-top:4px solid var(--primary); }
  .test-view-controls { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto; gap:12px; align-items:end; }
  .test-view-field { display:grid; gap:6px; margin:0; }
  .test-view-field span { color:var(--muted); font-size:13px; font-weight:700; }
  .test-view-field select { width:100%; min-height:44px; border:1px solid var(--border); border-radius:8px; background:#fff; padding:8px 12px; color:var(--text); }
  .test-view-start { min-height:44px; margin:0; white-space:nowrap; }
  .test-view-summary { margin-top:12px; padding:10px 12px; border-radius:8px; background:#f6faf8; color:var(--muted); font-size:13px; }
  .test-view-loading { padding:14px 0; color:var(--muted); }
  body.test-view-only .dashboard-content { display:none !important; }
  body.test-view-only #test-view { max-width:780px; margin:20px auto; }
  @media (max-width: 680px) {
    .test-view-controls { grid-template-columns:1fr; }
    .test-view-start { width:100%; }
  }
</style>
</head>
<body>
<div id="app-header"></div>

<style>
  @keyframes notifyPulse { 0%,100%{ box-shadow:0 2px 10px rgba(245,148,30,.25);} 50%{ box-shadow:0 4px 18px rgba(245,148,30,.45);} }
  @keyframes bellSwing { 0%,60%,100%{ transform:rotate(0);} 70%{ transform:rotate(14deg);} 80%{ transform:rotate(-10deg);} 90%{ transform:rotate(6deg);} }
  #notify-banner { cursor:pointer; background:linear-gradient(135deg,#F5941E,#FFB04A); color:#fff; padding:13px 18px; border-radius:14px; font-weight:700; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; gap:10px; animation:notifyPulse 2.6s ease-in-out infinite; }
  #notify-banner .bell { display:inline-block; animation:bellSwing 2.6s ease-in-out infinite; transform-origin:top center; }
  #notify-banner .pill { background:rgba(255,255,255,.28); border-radius:999px; padding:1px 9px; font-size:13px; }
  #notify-banner .go { font-size:13px; opacity:.95; }
  #notify-box.flash { box-shadow:0 0 0 3px #F5941E; transition:box-shadow .3s; }
  /* 訊息明細彈窗 */
  .nmodal-mask { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:60; padding:16px; }
  .nmodal-mask.show { display:flex; }
  .nmodal { background:#fff; border-radius:16px; width:100%; max-width:480px; max-height:82vh; overflow:auto; padding:20px; }
  .nmodal h3 { margin:0; color:var(--primary); }
  .nmodal .nitem { display:flex; gap:10px; padding:12px 0; border-bottom:1px solid var(--border); font-size:14px; line-height:1.6; }
  .nmodal .nitem:last-child { border-bottom:none; }
</style>

<div class="container">
  <h2 class="dashboard-content">👑 全機構總覽 · <span id="ym"></span></h2>

  <div class="card test-view-card" id="test-view">
    <div class="card-title">快速測試老師畫面</div>
    <div class="muted text-sm mb-2">選老師與工作區後立即查看。測試模式只能閱讀，不會修改正式資料。</div>
    <div id="impersonate-list"><div class="test-view-loading">正在準備老師名單…</div></div>
  </div>

  <!-- 即時訊息匡（點了彈出明細）-->
  <div id="notify-banner" class="dashboard-content" style="display:none;" onclick="goNotify()">
    <span><span class="bell">🔔</span> 你有 <span class="pill"><span id="notify-count">0</span> 則</span> 事項通知</span>
    <span class="go">點我看 ›</span>
  </div>

  <div class="dept-grid dashboard-content" id="dept-grid"></div>

  <div class="card mt-2 dashboard-content">
    <div class="card-title">📊 機構統計</div>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-num" id="total-users">—</div><div class="stat-label">總人數</div></div>
      <div class="stat-box"><div class="stat-num" id="total-today">—</div><div class="stat-label">今日已交</div></div>
      <div class="stat-box"><div class="stat-num" id="total-help">—</div><div class="stat-label">求助標記</div></div>
    </div>
  </div>

  <div class="card dashboard-content" id="notify-box">
    <div class="card-title">🔔 布拉克星球事項通知欄</div>
    <ul id="todos" style="margin:0; padding-left:20px;"></ul>
  </div>

</div>

<!-- 訊息明細彈窗 -->
<div class="nmodal-mask" id="nmodal" onclick="if(event.target===this)closeNotify()">
  <div class="nmodal">
    <div class="flex-between">
      <h3>🔔 事項通知</h3>
      <button class="btn btn-sm" onclick="closeNotify()">關閉</button>
    </div>
    <div id="nmodal-body" class="mt-1"></div>
    <button class="btn btn-primary mt-2" style="width:100%;" onclick="closeNotify(); goNotifyBox();">前往通知欄 ›</button>
  </div>
</div>

<script>
const session = AUTH.requireRole(['admin']);
let notifyItems = [];
let testViewUsers = [];
const TEST_VIEW_CACHE_KEY = 'kpi_test_view_users_v2';
const TEST_VIEW_LAST_KEY = 'kpi_test_view_last_v2';

window.addEventListener('load', async () => {
  UI.mountHeader(session);
  document.getElementById('ym').textContent = new Date().toISOString().slice(0, 7);
  const focusedTestView = window.location.hash === '#test-view' && normalizedNickname(session.nickname) === '柏翰';
  if (focusedTestView) {
    document.body.classList.add('test-view-only');
    await loadImpersonateList();
    return;
  }
  await Promise.allSettled([loadDashboard(), loadImpersonateList()]);
});

function safeText(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[character]));
}

function normalizedNickname(value) {
  return String(value || '').trim().replace(/(?:老師|主管)$/, '');
}

async function loadImpersonateList() {
  const wrap = document.getElementById('impersonate-list');
  if (normalizedNickname(session.nickname) !== '柏翰') {
    wrap.innerHTML = '<div class="muted">此功能只開放柏翰管理員使用。</div>';
    return;
  }
  const cached = readTestViewCache();
  if (cached.length) {
    testViewUsers = cached;
    renderImpersonateControls();
  } else {
    wrap.innerHTML = '<div class="test-view-loading">正在讀取老師名單…</div>';
  }
  try {
    const res = await API.listUsers();
    if (!res.ok) throw new Error(res.error || '無法讀取人員名單');
    testViewUsers = res.users
      .filter(user => ['active', 'pending'].includes(user.status) && user.role !== 'admin')
      .filter(user => KPI_WORKSPACES.getAssignments(user).length)
      .sort((a, b) => String(a.department || '').localeCompare(String(b.department || ''), 'zh-Hant') || String(a.nickname || '').localeCompare(String(b.nickname || ''), 'zh-Hant'));
    sessionStorage.setItem(TEST_VIEW_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), users: testViewUsers }));
    renderImpersonateControls();
  } catch (error) {
    if (!cached.length) wrap.innerHTML = `<div class="muted">${safeText(error.message || '無法讀取人員名單')}</div>`;
  }
}

function readTestViewCache() {
  try {
    const cached = JSON.parse(sessionStorage.getItem(TEST_VIEW_CACHE_KEY) || 'null');
    return cached && Date.now() - Number(cached.savedAt || 0) < 10 * 60 * 1000 && Array.isArray(cached.users) ? cached.users : [];
  } catch (error) { return []; }
}

function getLastTestView() {
  try { return JSON.parse(localStorage.getItem(TEST_VIEW_LAST_KEY) || 'null') || {}; }
  catch (error) { return {}; }
}

function renderImpersonateControls() {
  const wrap = document.getElementById('impersonate-list');
  if (!testViewUsers.length) {
    wrap.innerHTML = '<div class="muted">目前沒有可測試的人員。</div>';
    return;
  }
  const last = getLastTestView();
  const selected = testViewUsers.find(user => user.nickname === last.nickname) || testViewUsers[0];
  wrap.innerHTML = `<div class="test-view-controls">
    <label class="test-view-field"><span>老師／主管</span><select id="test-user-select">${testViewUsers.map(user => `<option value="${safeText(user.nickname)}" ${user.nickname === selected.nickname ? 'selected' : ''}>${safeText(user.nickname)}｜${safeText(user.department)}｜${user.role === 'manager' ? '主管' : user.role === 'admin_staff' ? '行政' : '老師'}</option>`).join('')}</select></label>
    <label class="test-view-field"><span>工作區</span><select id="test-workspace-select"></select></label>
    <button type="button" class="btn btn-primary test-view-start" id="test-view-start">立即查看</button>
  </div><div class="test-view-summary" id="test-view-summary"></div>`;
  updateWorkspaceOptions(last.workspaceId || '');
}

function updateWorkspaceOptions(preferredId = '') {
  const userSelect = document.getElementById('test-user-select');
  const workspaceSelect = document.getElementById('test-workspace-select');
  const summary = document.getElementById('test-view-summary');
  if (!userSelect || !workspaceSelect) return;
  const target = testViewUsers.find(user => user.nickname === userSelect.value) || testViewUsers[0];
  const assignments = KPI_WORKSPACES.getAssignments(target);
  const selected = assignments.find(item => item.id === preferredId) || assignments[0];
  workspaceSelect.innerHTML = assignments.map(item => `<option value="${safeText(item.id)}" ${item.id === selected?.id ? 'selected' : ''}>${safeText(item.label)}</option>`).join('');
  if (summary) summary.textContent = `${target.nickname} · ${target.department} · ${selected?.label || '尚未設定工作區'} · 唯讀測試`;
}

function impersonateAs(nickname, workspaceId) {
  const target = testViewUsers.find(user => user.nickname === nickname);
  const allowed = target && KPI_WORKSPACES.getAssignments(target).some(item => item.id === workspaceId);
  if (!target || !allowed) { UI.toast('找不到可測試的工作區', 'danger'); return; }
  localStorage.setItem(TEST_VIEW_LAST_KEY, JSON.stringify({ nickname, workspaceId }));
  const button = document.getElementById('test-view-start');
  if (button) { button.disabled = true; button.textContent = '正在切換…'; }
  AUTH.impersonate(target);
  window.location.href = KPI_WORKSPACES.hrefFor(workspaceId);
}

document.addEventListener('click', event => {
  const button = event.target.closest('#test-view-start');
  if (button) impersonateAs(document.getElementById('test-user-select')?.value, document.getElementById('test-workspace-select')?.value);
});

document.addEventListener('change', event => {
  if (event.target.id === 'test-user-select') updateWorkspaceOptions();
  if (event.target.id === 'test-workspace-select') {
    const target = testViewUsers.find(user => user.nickname === document.getElementById('test-user-select')?.value);
    const workspace = KPI_WORKSPACES.getAssignments(target || {}).find(item => item.id === event.target.value);
    const summary = document.getElementById('test-view-summary');
    if (summary && target) summary.textContent = `${target.nickname} · ${target.department} · ${workspace?.label || ''} · 唯讀測試`;
  }
});

async function loadDashboard() {
  UI.loading(true);
  const res = await API.getDashboard(session.nickname);
  UI.loading(false);
  if (!res.ok) {
    UI.toast(res.error, 'danger');
    return;
  }
  const grid = document.getElementById('dept-grid');
  grid.innerHTML = res.departments.map(d => `
    <div class="dept-card">
      <div class="dept-name">🏫 ${d.department}</div>
      <div class="dept-stat">主管：<strong>${d.manager}</strong></div>
      <div class="dept-stat">老師 ${d.teachers_count} 位</div>
      <div class="dept-stat">今日已交 ${d.today_submitted}/${d.teachers_count}</div>
      <div class="dept-score">${d.month_avg !== null ? d.month_avg : '—'}</div>
      <div class="text-sm muted">本月平均 KPI 分數</div>
    </div>
  `).join('');

  document.getElementById('total-users').textContent = res.total_users;
  const todaySubmitted = res.departments.reduce((s, d) => s + d.today_submitted, 0);
  document.getElementById('total-today').textContent = todaySubmitted;

  // 事項通知欄：指派給我的事項（即時）＋ 系統提醒
  const todos = [];
  let taskCount = 0;
  const todayStr = new Date().toISOString().slice(0, 10);
  try {
    const tr = await API.listTasks({ viewer: session.nickname, status: 'open' });
    if (tr.ok) {
      const mine = (tr.tasks || []).filter(t => t.assignee === session.nickname);
      taskCount = mine.length;
      mine.forEach(t => {
        const overdue = String(t.due_date) < todayStr;
        todos.push(`${overdue ? '⚠️' : '📌'} <strong>${escTodo(t.title)}</strong>（期限 ${t.due_date}${overdue ? ' 逾期' : ''}）— 來自 ${escTodo(t.created_by)}`);
      });
    }
  } catch (e) {}

  const today = new Date();
  if (today.getDate() >= 25) {
    todos.push('本月評核期：提醒各部門主管在月底完成老師評核');
    todos.push('柏翰：本月主管評核截止日：' + today.getFullYear() + '/' + (today.getMonth()+1) + '/' + new Date(today.getFullYear(), today.getMonth()+1, 0).getDate());
  }
  res.departments.forEach(d => {
    if (d.month_avg !== null && Number(d.month_avg) < 55) {
      todos.push(`⚠️ ${d.department} 本月平均 ${d.month_avg}（<55），主管獎金將連坐減半`);
    }
  });
  notifyItems = todos;
  document.getElementById('todos').innerHTML = todos.length === 0
    ? '<li class="muted">目前沒有通知</li>'
    : todos.map(t => `<li style="margin:4px 0;">${t}</li>`).join('');

  // 即時訊息匡：有事項才顯示
  const banner = document.getElementById('notify-banner');
  if (taskCount > 0) {
    document.getElementById('notify-count').textContent = taskCount;
    banner.style.display = 'flex';
    goNotify();   // 一打開就自動跳出對話匡
  } else {
    banner.style.display = 'none';
  }
}

function escTodo(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}

// 點訊息匡 → 彈出明細視窗
function goNotify() {
  const body = document.getElementById('nmodal-body');
  body.innerHTML = notifyItems.length
    ? notifyItems.map(t => `<div class="nitem">${t}</div>`).join('')
    : '<div class="muted">目前沒有通知</div>';
  document.getElementById('nmodal').classList.add('show');
}
function closeNotify() {
  document.getElementById('nmodal').classList.remove('show');
}
// 從彈窗前往通知欄並閃一下
function goNotifyBox() {
  const box = document.getElementById('notify-box');
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  box.classList.add('flash');
  setTimeout(() => box.classList.remove('flash'), 1500);
}
</script>
</body>
</html>
